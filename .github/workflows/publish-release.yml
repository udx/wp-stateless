name: Publish Release
run-name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. 1.2.3a)'
        required: true
      version:
        description: 'Release version (e.g. 1.2.3), default: latest'
        required: false
      prerelease:
        description: 'Pre-release version (e.g. RC1, beta, etc...)'
        required: false
      deploy_wporg:
        description: 'Deploy to WordPress.org after release (skipped for pre-releases)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    uses: udx/reusable-workflows/.github/workflows/wp-gh-release-ops.yml@master
    with:
      tag: ${{ github.event.inputs.tag }}
      version: ${{ github.event.inputs.version }}
      prerelease: ${{ github.event.inputs.prerelease }}

  deploy-wporg:
    if: ${{ inputs.deploy_wporg && !inputs.prerelease }}
    needs: release
    uses: udx/reusable-workflows/.github/workflows/wp-org-svn-deploy.yml@master
    with:
      tag: ${{ github.event.inputs.tag }}
    secrets:
      svn_username: ${{ secrets.SVN_USERNAME }}
      svn_password: ${{ secrets.SVN_PASSWORD }}
